<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Viewer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#map { width: 100%; flex: 1; min-height: 0; }
#resize-handle {
    width: 100%; height: 7px; background: #0d1b2a; cursor: ns-resize;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
#resize-handle::after { content: ''; width: 40px; height: 3px; background: #445; border-radius: 2px; }
#profile-container { position: relative; width: 100%; height: 160px; background: #16213e; padding: 8px 16px 20px 16px; flex-shrink: 0; }
#profile { width: 100%; height: 100%; cursor: crosshair; }
#tooltip { position: absolute; display: none; background: rgba(0,0,0,0.85); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; pointer-events: none; white-space: nowrap; z-index: 1000; }
#selection-info { position: absolute; top: 8px; right: 16px; background: rgba(0,0,0,0.8); color: #0ff; padding: 6px 8px 6px 14px; border-radius: 6px; font-size: 13px; display: none; align-items: center; gap: 10px; z-index: 1000; }
#make-segment-btn { background: #0ff; color: #003344; border: none; border-radius: 4px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
#make-segment-btn:hover { background: #5ff; }
#segments-panel {
    position: fixed; top: 12px; right: 12px; width: 200px;
    max-height: 45vh; overflow-y: auto;
    flex-direction: column; gap: 8px;
    display: none; z-index: 1100;
}
#segments-header { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #7a8aa0; padding: 0 2px; }
.segment-card {
    background: rgba(13, 27, 42, 0.95); border: 1px solid #2a3a4a;
    border-radius: 8px; padding: 8px 8px 8px 10px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.seg-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.seg-stats { flex: 1; min-width: 0; }
.seg-main { font-size: 14px; font-weight: 600; color: #fff; }
.seg-sub { font-size: 12px; color: #9ab; margin-top: 1px; }
.seg-close { background: none; border: none; color: #889; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; flex-shrink: 0; }
.seg-close:hover { color: #ff6b6b; }
#drop-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 255, 255, 0.08); border: 4px dashed #0ff;
    display: none; z-index: 9999; align-items: center; justify-content: center;
}
#drop-overlay .drop-text { font-size: 28px; color: #0ff; text-shadow: 0 0 20px rgba(0,255,255,0.5); }
#empty-state {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(26, 26, 46, 0.92); padding: 40px 60px; border-radius: 16px;
    z-index: 500; text-align: center; color: #888; pointer-events: none;
}
#empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.6; }
#empty-state .title { font-size: 24px; color: #ccc; margin-bottom: 8px; }
#empty-state .sub { font-size: 15px; color: #666; }
</style>
</head>
<body>
<div id="drop-overlay"><span class="drop-text">Drop GPX file here</span></div>
<div id="empty-state">
    <div class="icon">&#127956;</div>
    <div class="title">GPX Viewer</div>
    <div class="sub">Drag &amp; drop a .gpx file anywhere to get started</div>
</div>
<div id="map"></div>
<div id="resize-handle"></div>
<div id="profile-container">
    <canvas id="profile"></canvas>
    <div id="tooltip"></div>
    <div id="selection-info">
        <span id="selection-text"></span>
        <button id="make-segment-btn">+ Segment</button>
    </div>
</div>
<div id="segments-panel">
    <div id="segments-header">Segments</div>
</div>

<script>
let DATA = null;
let TZ_LABEL = '';

const map = L.map('map').setView([20, 0], 2);
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenTopoMap (CC-BY-SA)',
    maxZoom: 17
}).addTo(map);

let routeLine = L.polyline([], { color: '#ff6b6b', weight: 3.5, opacity: 0.9 }).addTo(map);
let highlightLine = L.polyline([], { color: '#0ff', weight: 5, opacity: 0.9 }).addTo(map);
const marker = L.circleMarker([0, 0], { radius: 8, color: '#fff', fillColor: '#ff6b6b', fillOpacity: 1, weight: 2 });

const canvas = document.getElementById('profile');
const ctx = canvas.getContext('2d');
const container = document.getElementById('profile-container');
const tooltip = document.getElementById('tooltip');
const selInfo = document.getElementById('selection-info');
const selText = document.getElementById('selection-text');
const makeSegmentBtn = document.getElementById('make-segment-btn');
const segmentsPanel = document.getElementById('segments-panel');
const emptyState = document.getElementById('empty-state');

let dpr, plotLeft, plotTop, plotWidth, plotHeight;
let minEle, maxEle, maxDist;
let selecting = false, selStart = null, selEnd = null;
let selI1 = null, selI2 = null;
let segments = [];
let segmentColorIdx = 0;
let editing = null; // { seg, side: 'left'|'right' } while dragging a segment edge
const SEGMENT_COLORS = ['#ffd166', '#06d6a0', '#a78bfa', '#4cc9f0', '#f72585', '#ff9f1c', '#80ed99', '#ff6bd6'];

function setup() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.scale(dpr, dpr);

    plotLeft = 0;
    plotTop = 10;
    plotWidth = canvas.clientWidth;
    plotHeight = canvas.clientHeight - 20;

    if (!DATA || DATA.length === 0) return;

    minEle = Math.min(...DATA.map(d => d.ele));
    maxEle = Math.max(...DATA.map(d => d.ele));
    if (maxEle - minEle < 10) { minEle -= 5; maxEle += 5; }
    let pad = (maxEle - minEle) * 0.1;
    minEle -= pad;
    maxEle += pad;
    maxDist = DATA[DATA.length - 1].dist;
}

function xForDist(dist) { return plotLeft + (dist / maxDist) * plotWidth; }
function yForEle(ele) { return plotTop + plotHeight - ((ele - minEle) / (maxEle - minEle)) * plotHeight; }
function distForX(x) { return ((x - plotLeft) / plotWidth) * maxDist; }

function draw() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    if (!DATA || DATA.length === 0) return;

    if (selStart !== null && selEnd !== null) {
        const x1 = Math.min(selStart, selEnd);
        const x2 = Math.max(selStart, selEnd);
        ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
        ctx.fillRect(x1, plotTop, x2 - x1, plotHeight);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const y = plotTop + (plotHeight / 4) * i;
        ctx.beginPath(); ctx.moveTo(plotLeft, y); ctx.lineTo(plotLeft + plotWidth, y); ctx.stroke();
    }

    ctx.beginPath();
    ctx.moveTo(xForDist(DATA[0].dist), yForEle(DATA[0].ele));
    for (let i = 1; i < DATA.length; i++) {
        ctx.lineTo(xForDist(DATA[i].dist), yForEle(DATA[i].ele));
    }
    ctx.lineTo(xForDist(DATA[DATA.length - 1].dist), plotTop + plotHeight);
    ctx.lineTo(xForDist(DATA[0].dist), plotTop + plotHeight);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, plotTop, 0, plotTop + plotHeight);
    grad.addColorStop(0, 'rgba(255, 107, 107, 0.6)');
    grad.addColorStop(1, 'rgba(255, 107, 107, 0.05)');
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(xForDist(DATA[0].dist), yForEle(DATA[0].ele));
    for (let i = 1; i < DATA.length; i++) {
        ctx.lineTo(xForDist(DATA[i].dist), yForEle(DATA[i].ele));
    }
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 2;
    ctx.stroke();

    drawSegmentBands();
    drawSegmentEdges();
}

function withAlpha(hex, a) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${a})`;
}

function drawSegmentBands() {
    for (const seg of segments) {
        const lx = xForDist(DATA[seg.i1].dist);
        const rx = xForDist(DATA[seg.i2].dist);
        ctx.fillStyle = withAlpha(seg.color, 0.14);
        ctx.fillRect(lx, plotTop, rx - lx, plotHeight);
    }
}

function drawSegmentEdges() {
    for (const seg of segments) {
        for (const x of [xForDist(DATA[seg.i1].dist), xForDist(DATA[seg.i2].dist)]) {
            ctx.strokeStyle = withAlpha(seg.color, 0.85);
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x, plotTop); ctx.lineTo(x, plotTop + plotHeight); ctx.stroke();
            ctx.fillStyle = seg.color;
            ctx.fillRect(x - 3, plotTop - 5, 6, 7); // grip at the top of the line
        }
    }
}

function findClosestIndex(dist) {
    let lo = 0, hi = DATA.length - 1;
    while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (DATA[mid].dist < dist) lo = mid + 1;
        else hi = mid;
    }
    if (lo > 0 && Math.abs(DATA[lo - 1].dist - dist) < Math.abs(DATA[lo].dist - dist)) lo--;
    return lo;
}

function showMarker(idx) {
    const d = DATA[idx];
    marker.setLatLng([d.lat, d.lon]);
    if (!map.hasLayer(marker)) marker.addTo(map);
}

function getCanvasX(e) {
    const rect = canvas.getBoundingClientRect();
    return e.clientX - rect.left;
}

canvas.addEventListener('mousemove', (e) => {
    if (!DATA || DATA.length === 0) return;
    if (editing) return; // edge drag is handled at document level
    const x = getCanvasX(e);
    if (!selecting) canvas.style.cursor = handleAt(x) ? 'ew-resize' : 'crosshair';
    const dist = distForX(x);
    if (dist < 0 || dist > maxDist) { tooltip.style.display = 'none'; return; }

    const idx = findClosestIndex(dist);
    const d = DATA[idx];
    showMarker(idx);

    let html = `<b>${(d.dist/1000 * 0.621371).toFixed(2)} mi</b> &mdash; ${(d.ele * 3.28084).toFixed(0)} ft`;
    if (d.time) html += `<br>Time: ${d.time}${TZ_LABEL ? ' (' + TZ_LABEL + ')' : ''}`;
    if (d.elapsed) html += `<br>Elapsed: ${d.elapsed}`;
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';

    const rect = container.getBoundingClientRect();
    let tx = e.clientX - rect.left + 15;
    let ty = e.clientY - rect.top - 40;
    if (tx + tooltip.offsetWidth > rect.width - 10) tx = e.clientX - rect.left - tooltip.offsetWidth - 15;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';

    if (selecting) {
        selEnd = x;
        draw();
        drawCrosshair(x, idx);
        updateSelection();
    } else {
        draw();
        drawCrosshair(x, idx);
    }
});

function drawCrosshair(x, idx) {
    const d = DATA[idx];
    const y = yForEle(d.ele);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x, plotTop); ctx.lineTo(x, plotTop + plotHeight); ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#ff6b6b';
    ctx.lineWidth = 2;
    ctx.stroke();
}

canvas.addEventListener('mousedown', (e) => {
    if (!DATA || DATA.length === 0) return;
    const x = getCanvasX(e);
    const h = handleAt(x);
    if (h) {
        // Grab a saved segment's edge instead of starting a new selection
        editing = h;
        document.body.style.cursor = 'ew-resize';
        e.preventDefault();
        return;
    }
    selecting = true;
    selStart = x;
    selEnd = selStart;
    selI1 = null; selI2 = null;
    highlightLine.setLatLngs([]);
    selInfo.style.display = 'none';
});

canvas.addEventListener('mouseup', () => {
    if (editing) return;
    if (selecting && selStart !== null && selEnd !== null && Math.abs(selEnd - selStart) > 5) {
        updateSelection();
    } else {
        clearSelection();
    }
    selecting = false;
});

canvas.addEventListener('mouseleave', () => {
    if (!selecting && !editing) {
        // Keep any active selection (highlight + info) when the cursor moves
        // off the profile; only drop the transient hover crosshair/marker.
        tooltip.style.display = 'none';
        marker.remove();
        draw();
    }
});

// Dragging a saved segment's left/right edge on the profile
document.addEventListener('mousemove', (e) => {
    if (!editing) return;
    setSegmentEdge(editing.seg, editing.side, getCanvasX(e));
});

document.addEventListener('mouseup', () => {
    if (editing) { editing = null; document.body.style.cursor = ''; }
});

const toMi = m => (m / 1000 * 0.621371).toFixed(2);
const toFt = m => Math.round(m * 3.28084);

function formatDuration(ms) {
    const total = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function segStats(i1, i2) {
    const distM = DATA[i2].dist - DATA[i1].dist;
    const eleChangeM = DATA[i2].ele - DATA[i1].ele;
    let gainM = 0, lossM = 0;
    for (let i = i1 + 1; i <= i2; i++) {
        const diff = DATA[i].ele - DATA[i - 1].ele;
        if (diff > 0) gainM += diff; else lossM += diff;
    }
    const elapsedMs = (DATA[i1].t != null && DATA[i2].t != null) ? (DATA[i2].t - DATA[i1].t) : null;
    return { distM, eleChangeM, gainM, lossM, elapsedMs };
}

function updateSelection() {
    if (selStart === null || selEnd === null) return;
    const x1 = Math.min(selStart, selEnd);
    const x2 = Math.max(selStart, selEnd);
    const i1 = findClosestIndex(distForX(x1));
    const i2 = findClosestIndex(distForX(x2));
    if (i1 === i2) return;
    selI1 = i1; selI2 = i2;

    const s = segStats(i1, i2);
    let html = `Distance: <b>${toMi(s.distM)} mi</b> | ` +
        `Elevation: <b>${s.eleChangeM >= 0 ? '+' : ''}${toFt(s.eleChangeM)} ft</b> | ` +
        `Gain: <b>+${toFt(s.gainM)} ft</b> | Loss: <b>${toFt(s.lossM)} ft</b>`;
    if (s.elapsedMs != null) html += ` | Time: <b>${formatDuration(s.elapsedMs)}</b>`;
    selText.innerHTML = html;
    selInfo.style.display = 'flex';

    const segLatLngs = DATA.slice(i1, i2 + 1).map(d => [d.lat, d.lon]);
    highlightLine.setLatLngs(segLatLngs);
}

function clearSelection() {
    selStart = null; selEnd = null;
    selI1 = null; selI2 = null;
    highlightLine.setLatLngs([]);
    selInfo.style.display = 'none';
    draw();
}

function makeSegment(i1, i2) {
    const color = SEGMENT_COLORS[segmentColorIdx % SEGMENT_COLORS.length];
    segmentColorIdx++;

    const line = L.polyline([], { color, weight: 5, opacity: 0.95 }).addTo(map);
    const seg = { i1, i2, color, line, el: null, mainEl: null, subEl: null };

    const card = document.createElement('div');
    card.className = 'segment-card';

    const swatch = document.createElement('span');
    swatch.className = 'seg-color';
    swatch.style.background = color;

    const stats = document.createElement('div');
    stats.className = 'seg-stats';
    const mainEl = document.createElement('div');
    mainEl.className = 'seg-main';
    const subEl = document.createElement('div');
    subEl.className = 'seg-sub';
    stats.appendChild(mainEl);
    stats.appendChild(subEl);

    const close = document.createElement('button');
    close.className = 'seg-close';
    close.innerHTML = '&times;';
    close.title = 'Remove segment';
    close.addEventListener('click', () => removeSegment(seg));

    card.appendChild(swatch);
    card.appendChild(stats);
    card.appendChild(close);
    seg.el = card;
    seg.mainEl = mainEl;
    seg.subEl = subEl;
    segmentsPanel.appendChild(card);
    segments.push(seg);
    segmentsPanel.style.display = 'flex';

    updateSegmentGeometry(seg);
    clearSelection();
}

// Sync a segment's map polyline and card stats to its current i1/i2
function updateSegmentGeometry(seg) {
    seg.line.setLatLngs(DATA.slice(seg.i1, seg.i2 + 1).map(d => [d.lat, d.lon]));
    const s = segStats(seg.i1, seg.i2);
    seg.mainEl.textContent = `${toMi(s.distM)} mi`;
    let sub = `+${toFt(s.gainM)} ft`;
    if (s.elapsedMs != null) sub += ` · ${formatDuration(s.elapsedMs)}`;
    seg.subEl.textContent = sub;
}

// Nearest segment edge within a few px of canvas x, or null
function handleAt(x) {
    const TH = 6;
    let best = null, bestDist = TH + 1;
    for (const seg of segments) {
        const lx = xForDist(DATA[seg.i1].dist);
        const rx = xForDist(DATA[seg.i2].dist);
        if (Math.abs(x - lx) < bestDist) { bestDist = Math.abs(x - lx); best = { seg, side: 'left' }; }
        if (Math.abs(x - rx) < bestDist) { bestDist = Math.abs(x - rx); best = { seg, side: 'right' }; }
    }
    return best;
}

function setSegmentEdge(seg, side, x) {
    const idx = findClosestIndex(Math.max(0, Math.min(maxDist, distForX(x))));
    if (side === 'left') {
        seg.i1 = Math.max(0, Math.min(idx, seg.i2 - 1));
    } else {
        seg.i2 = Math.min(DATA.length - 1, Math.max(idx, seg.i1 + 1));
    }
    updateSegmentGeometry(seg);
    draw();
}

function removeSegment(seg) {
    map.removeLayer(seg.line);
    seg.el.remove();
    const idx = segments.indexOf(seg);
    if (idx >= 0) segments.splice(idx, 1);
    if (segments.length === 0) segmentsPanel.style.display = 'none';
    draw();
}

function clearAllSegments() {
    segments.forEach(seg => { map.removeLayer(seg.line); seg.el.remove(); });
    segments = [];
    segmentColorIdx = 0;
    segmentsPanel.style.display = 'none';
}

makeSegmentBtn.addEventListener('click', () => {
    if (selI1 === null || selI2 === null) return;
    makeSegment(selI1, selI2);
});

// --- GPX Parsing (client-side) ---

function haversineJS(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const phi1 = lat1 * Math.PI / 180, phi2 = lat2 * Math.PI / 180;
    const dphi = (lat2 - lat1) * Math.PI / 180;
    const dlam = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dlam/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function parseGPXClient(xmlStr) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlStr, 'application/xml');

    const ns = 'http://www.topografix.com/GPX/1/1';
    let trkpts = Array.from(doc.getElementsByTagNameNS(ns, 'trkpt'));
    if (trkpts.length === 0) trkpts = Array.from(doc.getElementsByTagNameNS(ns, 'rtept'));
    if (trkpts.length === 0) trkpts = Array.from(doc.querySelectorAll('trkpt'));
    if (trkpts.length === 0) trkpts = Array.from(doc.querySelectorAll('rtept'));
    if (trkpts.length === 0) return null;

    // Downsample if too many points (keep ~3000 for smooth rendering)
    const maxPoints = 3000;
    let step = 1;
    if (trkpts.length > maxPoints) {
        step = Math.floor(trkpts.length / maxPoints);
    }

    const points = [];
    for (let i = 0; i < trkpts.length; i += step) {
        const pt = trkpts[i];
        const lat = parseFloat(pt.getAttribute('lat'));
        const lon = parseFloat(pt.getAttribute('lon'));
        const eleEl = pt.getElementsByTagNameNS(ns, 'ele')[0] || pt.querySelector('ele');
        const timeEl = pt.getElementsByTagNameNS(ns, 'time')[0] || pt.querySelector('time');
        points.push({
            lat, lon,
            ele: eleEl ? parseFloat(eleEl.textContent) : 0,
            time: timeEl ? new Date(timeEl.textContent) : null,
        });
    }
    // Always include last point
    const lastPt = trkpts[trkpts.length - 1];
    const lastLat = parseFloat(lastPt.getAttribute('lat'));
    const lastLon = parseFloat(lastPt.getAttribute('lon'));
    const lastEleEl = lastPt.getElementsByTagNameNS(ns, 'ele')[0] || lastPt.querySelector('ele');
    const lastTimeEl = lastPt.getElementsByTagNameNS(ns, 'time')[0] || lastPt.querySelector('time');
    if (points[points.length-1].lat !== lastLat || points[points.length-1].lon !== lastLon) {
        points.push({
            lat: lastLat, lon: lastLon,
            ele: lastEleEl ? parseFloat(lastEleEl.textContent) : 0,
            time: lastTimeEl ? new Date(lastTimeEl.textContent) : null,
        });
    }

    let tzLabel = '';
    try {
        tzLabel = Intl.DateTimeFormat().resolvedOptions().timeZone;
    } catch(e) {}

    const startTime = points[0].time;
    let cumDist = 0;
    const data = [];

    for (let i = 0; i < points.length; i++) {
        const pt = points[i];
        if (i > 0) {
            cumDist += haversineJS(points[i-1].lat, points[i-1].lon, pt.lat, pt.lon);
        }

        let timeStr = '', elapsedStr = '';
        if (pt.time) {
            timeStr = pt.time.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            if (startTime) elapsedStr = formatDuration(pt.time - startTime);
        }

        data.push({
            lat: pt.lat, lon: pt.lon,
            ele: Math.round(pt.ele * 10) / 10,
            dist: Math.round(cumDist * 10) / 10,
            time: timeStr,
            elapsed: elapsedStr,
            t: pt.time ? pt.time.getTime() : null,
        });
    }

    return { data, tzLabel };
}

function loadGPXData(data, tzLabel) {
    DATA = data;
    TZ_LABEL = tzLabel || '';
    emptyState.style.display = 'none';

    selStart = null; selEnd = null;
    selI1 = null; selI2 = null;
    selInfo.style.display = 'none';
    tooltip.style.display = 'none';
    clearAllSegments();

    const latlngs = DATA.map(d => [d.lat, d.lon]);
    routeLine.setLatLngs(latlngs);
    highlightLine.setLatLngs([]);
    marker.remove();

    map.fitBounds(L.latLngBounds(latlngs).pad(0.05));
    setup();
    draw();
}

// --- Drag and Drop ---

const dropOverlay = document.getElementById('drop-overlay');
let dragCounter = 0;

document.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragCounter++;
    dropOverlay.style.display = 'flex';
});

document.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragCounter--;
    if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.style.display = 'none';
    }
});

document.addEventListener('dragover', (e) => {
    e.preventDefault();
});

document.addEventListener('drop', (e) => {
    e.preventDefault();
    dragCounter = 0;
    dropOverlay.style.display = 'none';

    const files = e.dataTransfer.files;
    if (files.length === 0) return;

    const file = files[0];
    if (!file.name.toLowerCase().endsWith('.gpx')) {
        alert('Please drop a .gpx file');
        return;
    }

    const reader = new FileReader();
    reader.onload = (ev) => {
        const result = parseGPXClient(ev.target.result);
        if (!result || !result.data || result.data.length === 0) {
            alert('Could not parse GPX file or no points found.');
            return;
        }
        document.title = file.name.replace('.gpx','') + ' - GPX Viewer';
        loadGPXData(result.data, result.tzLabel);
    };
    reader.readAsText(file);
});

// --- Resize Handle ---

const resizeHandle = document.getElementById('resize-handle');
let resizing = false;

resizeHandle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    resizing = true;
    document.body.style.cursor = 'ns-resize';
});

document.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const bodyHeight = window.innerHeight;
    const newProfileHeight = bodyHeight - e.clientY - 7;
    const clamped = Math.max(80, Math.min(newProfileHeight, bodyHeight - 200));
    container.style.height = clamped + 'px';
    map.invalidateSize();
    setup();
    draw();
});

document.addEventListener('mouseup', () => {
    if (resizing) {
        resizing = false;
        document.body.style.cursor = '';
    }
});

window.addEventListener('resize', () => { map.invalidateSize(); setup(); draw(); });
</script>
</body>
</html>
